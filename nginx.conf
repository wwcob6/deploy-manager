# nginx 配置 — 放到 nginx 服务器的 conf.d 目录下
server {
    listen 80;
    server_name your-server-ip;

    # 静态前端
    location / {
        root /path/to/deploy-manager;
        index index.html;
    }

    # API 代理到 Windows 后端
    location /api/ {
        proxy_pass http://你的Windows内网IP:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
