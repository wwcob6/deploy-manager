  var reqs = (w.requirements || []).filter(function(r) { return r.status !== 'delayed'; });
  reqs.forEach(function(r) {
    (r.sqlFiles || []).forEach(function(s) {
      var content = '-- 数据库：' + s.dbName + '\n-- 需求：' + r.name + '（' + r.number + '）\n-- 解决人：' + (r.resolver || '') + '\n-- 生成时间：' + new Date().toLocaleString() + '\n\n'
        + '-- ========== 查询 ==========\n' + (s.query || '-- (无)') + '\n\n'
        + '-- ========== 执行 ==========\n' + (s.execute || '-- (无)') + '\n\n'
        + '-- ========== 回退 ==========\n' + (s.rollback || '-- (无)') + '\n';
      var filename = s.dbName + r.name + '.sql';
      files.push({ name: filename, data: content });
    });
    (r.apis || []).forEach(function(a) {
      var content = 'API: ' + (a.apiName || '') + '\r\n'
        + 'API分组: ' + (a.apiGroup || '') + '\r\n'
        + 'API版本: ' + (a.apiVersion || '') + '\r\n'
        + '简介: ' + (a.description || '') + '\r\n'
        + '接入方式: ' + (a.accessMethod || '') + '\r\n'
        + '接出模板: ' + (a.outTemplate || '') + '\r\n'
        + '接出实例: ' + (a.outInstance || '') + '\r\n'
        + '资源路径: ' + (a.resourcePath || '') + '\r\n'
        + 'drs服务类型: ' + (a.drsServiceType || '') + '\r\n'
        + '报文转换: ' + (a.messageTransform || '') + '\r\n';
      var fn = (a.apiName || 'api') + '_' + (a.apiVersion || '') + '.txt';
      files.push({ name: fn, data: content });
    });

  });
  if (!files.length) { showToast('该窗口无SQL文件', 'error'); return; }

  var zip = createZip(files);
  var blob = new Blob([zip], { type: 'application/zip' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '投产窗口_' + w.date + '_SQL.zip';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('已下载 ' + files.length + ' 个SQL文件压缩包', 'success');
}

// minimal zip creator (no external libs)
function createZip(files) {
  var encoder = new TextEncoder();
  var localHeaders = [];
  var centralHeaders = [];
  var offset = 0;

  files.forEach(function(f) {
    var nameBytes = encoder.encode(f.name);
    var dataBytes = encoder.encode('﻿' + f.data); // UTF-8 BOM
    var crc = crc32(dataBytes);
    var compressed = dataBytes; // store (no compression)

    // Local file header
    var local = new Uint8Array(30 + nameBytes.length + compressed.length);
    var v = new DataView(local.buffer);
    v.setUint32(0, 0x04034b50, true);  // signature
    v.setUint16(4, 20, true);          // version needed
    v.setUint16(6, 0x0800, true);      // flags (UTF-8)
    v.setUint16(8, 0, true);           // method (store)
    v.setUint32(10, 0, true);          // mod time (unused)
    v.setUint32(14, crc, true);        // crc32
    v.setUint32(18, compressed.length, true);  // compressed size
    v.setUint32(22, dataBytes.length, true);   // uncompressed size
    v.setUint16(26, nameBytes.length, true);    // filename length
    v.setUint16(28, 0, true);          // extra field length
    local.set(nameBytes, 30);
    local.set(compressed, 30 + nameBytes.length);
    localHeaders.push(local);

    // Central directory entry
    var central = new Uint8Array(46 + nameBytes.length);
    var cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);  // signature
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint32(12, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, compressed.length, true);
    cv.setUint32(24, dataBytes.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralHeaders.push(central);

    offset += local.length;
  });

  // End of central directory
  var centralOffset = offset;
  var centralSize = centralHeaders.reduce(function(s, c) { return s + c.length; }, 0);
  var eocd = new Uint8Array(22);
  var ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralOffset, true);
  ev.setUint16(20, 0, true);

  // Concatenate
  var total = offset + centralSize + 22;
  var result = new Uint8Array(total);
  var pos = 0;
  localHeaders.forEach(function(l) { result.set(l, pos); pos += l.length; });
  centralHeaders.forEach(function(c) { result.set(c, pos); pos += c.length; });
  result.set(eocd, pos);
  return result;
}

// CRC32 implementation
var crcTable = [];
(function() {
  for (var n = 0; n < 256; n++) {
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    crcTable[n] = c;
  }
})();
function crc32(data) {
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < data.length; i++) crc = crcTable[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// ========== GitHub / GitLab Integration ==========
function toggleSettings() {
  if (!ensurePermission(canManageGitSettings(), '只有管理员可以配置 Git 仓库')) return;
  showSettings();
}
function showSettings() {
  document.getElementById('settingsModal').classList.add('show');
  document.getElementById('gitProvider').value = gitConfig.provider || 'github';
  document.getElementById('gitlabHost').value = (gitConfig.gitlab && gitConfig.gitlab.host) || '';
  var tokenInput = document.getElementById('gitToken');
  tokenInput.value = '';
  tokenInput.placeholder = (gitConfig.github && gitConfig.github.hasToken) || (gitConfig.gitlab && gitConfig.gitlab.hasToken) ? '已配置，留空不修改' : '输入Token';
  toggleGitFields();
}
function toggleGitFields() {
  document.getElementById('gitlabFields').style.display = document.getElementById('gitProvider').value === 'gitlab' ? '' : 'none';
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }
async function saveSettings() {
  var provider = document.getElementById('gitProvider').value;
  var token = document.getElementById('gitToken').value.trim();
  if (!gitConfig.gitlab) gitConfig.gitlab = { host: '', token: '' };
  if (!gitConfig.github) gitConfig.github = { owner: '', repo: '', token: '' };
  gitConfig.provider = provider;
  if (provider === 'gitlab') gitConfig.gitlab.host = document.getElementById('gitlabHost').value.trim();
  gitConfig.github.token = token;
  gitConfig.gitlab.token = token;
  var ok = await saveGitConfig(gitConfig);
  if (!ok) return;
  closeSettings();
  showToast('Git 配置已保存', 'success');
}

async function fetchRepos() {
  var provider = gitConfig.provider || 'github';
  var isGithub = provider === 'github';
  var hasToken = isGithub ? (gitConfig.github && gitConfig.github.hasToken) : (gitConfig.gitlab && gitConfig.gitlab.hasToken);
  if (isServerMode && !hasToken) { showToast('请先在设置中配置 Token', 'error'); return; }
  if (!isServerMode) {
    var token = isGithub ? (gitConfig.github && gitConfig.github.token) : (gitConfig.gitlab && gitConfig.gitlab.token);
    if (!token) { showToast('请先在设置中配置 Token', 'error'); return; }
  }
  if (!isGithub && (!gitConfig.gitlab || !gitConfig.gitlab.host)) { showToast('请先在设置中配置GitLab地址', 'error'); return; }

  var statusEl = document.getElementById('repoFetchStatus');
  function setRepoFetchStatus(text) { if (statusEl) statusEl.textContent = text; }
  setRepoFetchStatus('正在获取项目列表...');
  try {
    var allRepos = [], page = 1;
    while (page <= 10) {
      var url, resp;
      if (isServerMode) {
        url = API_BASE + '/api/repos?page=' + page;
        resp = await fetch(url);
      } else if (isGithub) {
        url = 'https://api.github.com/user/repos?per_page=100&page=' + page + '&sort=updated';
        resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
      } else {
        var host = gitConfig.gitlab.host.replace(/\/+$/, '');
        url = host + '/api/v4/projects?membership=true&per_page=100&page=' + page;
        resp = await fetch(url, { headers: { 'PRIVATE-TOKEN': token } });
      }
      if (!resp.ok) {
        var errBody = await resp.json().catch(function(){ return {}; });
        throw new Error(errBody.message || ('HTTP ' + resp.status));
      }
      var items = await resp.json();
      if (!items.length) break;
      allRepos = allRepos.concat(items);
      if (items.length < 100) break;
      page++;
    }
    if (isGithub) {
      githubRepos = allRepos.map(function(r) { return { full_name: r.full_name, name: r.name }; }).sort(function(a, b) { return a.name.localeCompare(b.name); });
    } else {
      githubRepos = allRepos.map(function(r) { return { full_name: String(r.id), name: r.path_with_namespace || r.name }; }).sort(function(a, b) { return a.name.localeCompare(b.name); });
    }
    setRepoFetchStatus('已加载 ' + githubRepos.length + ' 个项目');
    showToast('已获取 ' + githubRepos.length + ' 个项目', 'success');
    refreshAllModuleRepoSelects();
  } catch (err) {
    setRepoFetchStatus('获取失败');
    showToast('获取项目列表失败：' + err.message, 'error');
  }
}

function refreshAllModuleRepoSelects() {
  suppressRepoChange = true;
  document.querySelectorAll('#modulesContainer .form-row').forEach(function(row) {
    var selects = row.querySelectorAll('select');
    if (selects.length >= 2) {
      var curRepo = selects[0].value, curBranch = selects[1].value;
      var repoHtml = '<option value="">-- 选择项目 --</option>';
      githubRepos.forEach(function(r) {
        repoHtml += '<option value="' + escHtml(r.full_name) + '"' + (r.full_name === curRepo ? ' selected' : '') + '>' + escHtml(r.name) + '</option>';
      });
      selects[0].innerHTML = repoHtml;
      var cached = branchCache[curRepo];
      if (cached && cached.length) {
        selects[1].innerHTML = '<option value="">-- 选择分支 --</option>' + cached.map(function(b) {
          return '<option value="' + escHtml(b.name) + '"' + (curBranch === b.name ? ' selected' : '') + '>' + escHtml(b.name) + '</option>';
        }).join('');
      } else if (curBranch) {
        selects[1].innerHTML = '<option value="' + escHtml(curBranch) + '" selected>' + escHtml(curBranch) + '</option>';
      }
    }
  });
  document.querySelectorAll('.inline-module-row').forEach(function(row) {
    var repoSelect = row.querySelector('[data-field="repo"]');
    var branchSelect = row.querySelector('[data-field="branch"]');
    if (!repoSelect || !branchSelect) return;
    var curRepo = repoSelect.value;
    var curBranch = branchSelect.value;
    var repoHtml = '<option value="">-- 选择项目 --</option>';
    githubRepos.forEach(function(r) {
      repoHtml += '<option value="' + escHtml(r.full_name) + '"' + (r.full_name === curRepo ? ' selected' : '') + '>' + escHtml(r.name) + '</option>';
    });
    repoSelect.innerHTML = repoHtml;
    branchSelect.innerHTML = buildBranchOptionsForForm(curRepo, curBranch);
  });
  suppressRepoChange = false;
}

async function onModuleRepoChange(idx) {
  if (suppressRepoChange) return;
  var sel = document.getElementById('modName' + idx);
  var repoFull = sel ? sel.value : '';
  var branchSel = document.getElementById('modBranch' + idx);
  if (!repoFull) { if (branchSel) branchSel.innerHTML = '<option value="">-- 选择项目 --</option>'; return; }

  if (branchCache[repoFull]) {
    if (branchSel) branchSel.innerHTML = buildBranchOptionsForForm(repoFull);
    return;
  }

  if (branchSel) { branchSel.innerHTML = '<option value="">正在加载...</option>'; branchSel.disabled = true; }

  if (!branchLoading[repoFull]) {
    branchLoading[repoFull] = loadBranchesForRepo(repoFull).then(function(b) { branchCache[repoFull] = b; delete branchLoading[repoFull]; return b; }).catch(function(e) { delete branchLoading[repoFull]; throw e; });
  }

  try {
    var branches = await branchLoading[repoFull];
    if (branchSel) { branchSel.innerHTML = buildBranchOptionsForForm(repoFull); branchSel.disabled = false; }
  } catch (err) {
    if (branchSel) { branchSel.innerHTML = '<option value="">' + err.message + '</option>'; branchSel.disabled = false; }
    showToast('分支加载失败：' + err.message, 'error');
  }
}

async function loadBranchesForRepo(repoFull) {
  var provider = gitConfig.provider || 'github';
  var isGithub = provider === 'github';
  if (isServerMode) {
    var serverResp = await fetch(API_BASE + '/api/branches?repo=' + encodeURIComponent(repoFull));
    if (!serverResp.ok) {
      var serverErr = await serverResp.json().catch(function(){ return {}; });
      throw new Error(serverErr.message || ('HTTP ' + serverResp.status));
    }
    return await serverResp.json();
  }

  var token = isGithub ? (gitConfig.github && gitConfig.github.token) : (gitConfig.gitlab && gitConfig.gitlab.token);
  if (!token) throw new Error('未配置 Token');

  var url;
  if (isGithub) {
    var parts = repoFull.split('/');
    url = 'https://api.github.com/repos/' + encodeURIComponent(parts[0]) + '/' + encodeURIComponent(parts[1] || '') + '/branches?per_page=100';
  } else {
    var host = gitConfig.gitlab.host.replace(/\/+$/, '');
    url = host + '/api/v4/projects/' + encodeURIComponent(repoFull) + '/repository/branches?per_page=100';
  }

  var headers = isGithub
    ? { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
    : { 'PRIVATE-TOKEN': token };

  var resp = await fetch(url, { headers: headers });
  if (resp.status === 401) throw new Error('Token无效或无权访问');
  if (resp.status === 404) throw new Error('仓库不存在或无权限');
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return await resp.json();
}

// ========== Init ==========
function initUI() {
  var modeBadge = document.getElementById('modeBadge');
  if (isServerMode) {
    modeBadge.textContent = '共享';
    modeBadge.className = 'mode-badge shared';
  } else {
    modeBadge.textContent = '本地';
    modeBadge.className = 'mode-badge local';
  }
  applyPermissionChrome();
  if (data.years.length > 0) {
    data.years.forEach(function(y) { expandedYears[y] = true; });
    currentYear = data.years[data.years.length - 1];
    var yw = data.windows.filter(function(w) { return w.year === currentYear; });
    if (yw.length > 0) selectedWindowId = yw[yw.length - 1].id;
  }
  renderSidebar();
  renderMain();
}

loadSession(function(ok) {
  if (!ok && isServerMode) return;
  loadGitConfig(function() {
    loadData();
  });
});
